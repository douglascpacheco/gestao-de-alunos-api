name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
      BASE_URL: http://127.0.0.1:3000
      ADMIN_USER: admin@escola.com
      ADMIN_PASSWORD: admin123

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API
        run: npm start &

      - name: Aguardar API responder
        run: |
          for tentativa in {1..30}; do
            if curl --fail --silent --max-time 2 "$BASE_URL/"; then
              exit 0
            fi
            sleep 2
          done
          echo "A API não respondeu no tempo esperado."
          exit 1

      - name: Executar testes
        run: npm test
